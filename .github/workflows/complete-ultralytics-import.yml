name: Complete ultralytics archive import

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/complete-ultralytics-import.yml

permissions:
  contents: write

jobs:
  complete-import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install import tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet gdown
          git lfs install --local

      - name: Download archive from Google Drive
        env:
          DRIVE_FILE_ID: 15XfHhttxbvWlwL_qE1VLGdkbbAS_uOQg
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          echo "IMPORT_WORK_DIR=$work_dir" >> "$GITHUB_ENV"
          gdown "$DRIVE_FILE_ID" --output "$work_dir/ultralytics.zip"

      - name: Validate and extract archive
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          work_dir = Path(os.environ["IMPORT_WORK_DIR"])
          archive = work_dir / "ultralytics.zip"
          extracted = work_dir / "extracted"
          extracted.mkdir()

          with zipfile.ZipFile(archive) as bundle:
              members = []
              for member in bundle.infolist():
                  normalized = member.filename.replace("\\", "/")
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or ".." in path.parts:
                      raise RuntimeError(f"Unsafe archive path: {member.filename}")
                  if ".git" in path.parts or "__MACOSX" in path.parts:
                      continue
                  members.append(member)
              bundle.extractall(extracted, members)

          for junk in extracted.rglob(".DS_Store"):
              junk.unlink()
          for git_dir in list(extracted.rglob(".git")):
              if git_dir.is_dir():
                  shutil.rmtree(git_dir)

          items = sorted(extracted.iterdir(), key=lambda path: path.name.lower())
          if not items:
              raise RuntimeError("The archive did not contain any importable items.")
          payload = items[0] if len(items) == 1 and items[0].is_dir() else extracted
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"PAYLOAD_ROOT={payload}\n")
          PY

      - name: Restore all archive contents
        run: |
          set -euo pipefail
          test -d ultralytics
          rsync -a --exclude .git --exclude .DS_Store --exclude __MACOSX "$PAYLOAD_ROOT/" ultralytics/
          git lfs track "ultralytics/**/*.pt"
          git lfs track "ultralytics/**/*.pth"
          git lfs track "ultralytics/**/*.onnx"
          while IFS= read -r -d '' large_file; do
            git lfs track "$large_file"
          done < <(find ultralytics -type f -size +95M -print0)

      - name: Force-add files ignored by the imported project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- ultralytics .gitattributes
          if git diff --cached --quiet; then
            echo "No missing archive files were found."
            exit 0
          fi
          added_count="$(git diff --cached --name-only --diff-filter=A | wc -l | tr -d ' ')"
          echo "RESTORED_FILE_COUNT=$added_count"
          git commit -m "Include ignored files from ultralytics archive"
          git push origin main
