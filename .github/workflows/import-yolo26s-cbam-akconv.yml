name: Import YOLO26s CBAM AKConv results

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-yolo26s-cbam-akconv.yml

permissions:
  contents: write

jobs:
  import-results:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install import tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet gdown pyyaml
          git lfs install --local

      - name: Download and extract the Drive archive
        env:
          DRIVE_FILE_ID: 1sowYIr6-aNngqQU3nEJQAUnpz7uAA0h9
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          echo "IMPORT_WORK_DIR=$work_dir" >> "$GITHUB_ENV"
          gdown "$DRIVE_FILE_ID" --output "$work_dir/runs.zip"
          mkdir -p "$work_dir/extracted"
          unzip -q "$work_dir/runs.zip" -d "$work_dir/extracted"

      - name: Locate and flatten the actual run directory
        run: |
          set -euo pipefail
          candidates=()
          while IFS= read -r -d '' csv_file; do
            candidate="$(dirname "$csv_file")"
            if [ -f "$candidate/args.yaml" ]; then
              candidates+=("$candidate")
            fi
          done < <(find "$IMPORT_WORK_DIR/extracted" -type f -name results.csv -print0)

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No directory containing both results.csv and args.yaml was found." >&2
            find "$IMPORT_WORK_DIR/extracted" -maxdepth 5 -type f -print
            exit 1
          fi

          run_dir=""
          for candidate in "${candidates[@]}"; do
            if [ "$(basename "$candidate")" = "yolo26s_cbam_akconv" ]; then
              run_dir="$candidate"
              break
            fi
          done

          if [ -z "$run_dir" ]; then
            if [ "${#candidates[@]}" -eq 1 ]; then
              run_dir="${candidates[0]}"
            else
              echo "Multiple possible run directories were found:" >&2
              printf '%s\n' "${candidates[@]}" >&2
              exit 1
            fi
          fi

          target="results/yolo26s_cbam_akconv"
          mkdir -p "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf -- {} +
          rsync -a             --exclude README.md             --exclude .DS_Store             --exclude __MACOSX             "$run_dir/" "$target/"
          find "$target" -type f -name .DS_Store -delete
          find "$target" -type d -name __MACOSX -prune -exec rm -rf -- {} +

          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"

      - name: Inspect imported artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from collections import Counter
          from pathlib import Path

          import yaml

          target = Path("results/yolo26s_cbam_akconv")
          archive = Path(os.environ["IMPORT_WORK_DIR"]) / "runs.zip"
          run_dir = Path(os.environ["RUN_DIR"])
          extracted = Path(os.environ["IMPORT_WORK_DIR"]) / "extracted"

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          files = sorted(
              path for path in target.rglob("*")
              if path.is_file() and path.name != "README.md"
          )
          inventory = []
          extension_counts = Counter()
          for path in files:
              relative = path.relative_to(target).as_posix()
              suffix = path.suffix.lower() or "[no extension]"
              extension_counts[suffix] += 1
              inventory.append({
                  "path": relative,
                  "bytes": path.stat().st_size,
              })

          top_level = []
          for item in sorted(target.iterdir(), key=lambda p: p.name.lower()):
              if item.name == "README.md":
                  continue
              if item.is_dir():
                  item_files = [p for p in item.rglob("*") if p.is_file()]
                  top_level.append({
                      "name": item.name,
                      "type": "directory",
                      "file_count": len(item_files),
                      "bytes": sum(p.stat().st_size for p in item_files),
                      "direct_children": sorted(p.name for p in item.iterdir()),
                  })
              else:
                  top_level.append({
                      "name": item.name,
                      "type": "file",
                      "bytes": item.stat().st_size,
                  })

          csv_summary = None
          results_csv = target / "results.csv"
          if results_csv.exists():
              with results_csv.open(newline="", encoding="utf-8-sig") as stream:
                  reader = csv.DictReader(stream)
                  rows = [
                      {(key or "").strip(): (value or "").strip() for key, value in row.items()}
                      for row in reader
                  ]
              metric_candidates = [
                  "metrics/mAP50-95(B)",
                  "metrics/mAP50-95",
                  "metrics/mAP50-95(M)",
              ]
              metric_key = next(
                  (key for key in metric_candidates if rows and key in rows[0]),
                  None,
              )
              best_row = None
              if metric_key:
                  numeric_rows = []
                  for row in rows:
                      try:
                          numeric_rows.append((float(row[metric_key]), row))
                      except (TypeError, ValueError):
                          pass
                  if numeric_rows:
                      best_row = max(numeric_rows, key=lambda pair: pair[0])[1]
              csv_summary = {
                  "columns": list(rows[0].keys()) if rows else [],
                  "row_count": len(rows),
                  "best_metric_key": metric_key,
                  "best_row": best_row,
                  "last_row": rows[-1] if rows else None,
              }

          args_data = None
          args_path = target / "args.yaml"
          if args_path.exists():
              with args_path.open(encoding="utf-8") as stream:
                  args_data = yaml.safe_load(stream)

          report = {
              "archive_name": "(cbam_akconv)runs.zip",
              "archive_bytes": archive.stat().st_size,
              "archive_sha256": digest(archive),
              "source_directory": run_dir.relative_to(extracted).as_posix(),
              "target": target.as_posix(),
              "file_count": len(files),
              "total_bytes": sum(path.stat().st_size for path in files),
              "extension_counts": dict(sorted(extension_counts.items())),
              "top_level_items": top_level,
              "file_inventory": inventory,
              "results_csv": csv_summary,
              "args_yaml": args_data,
          }
          print("IMPORT_REPORT_JSON=" + json.dumps(report, ensure_ascii=False, separators=(",", ":")))
          PY

      - name: Track model weights with Git LFS
        run: |
          set -euo pipefail
          target="results/yolo26s_cbam_akconv"
          git lfs track "results/yolo26s_cbam_akconv/**/*.pt"
          while IFS= read -r -d '' large_file; do
            git lfs track "$large_file"
          done < <(find "$target" -type f -size +95M -print0)

      - name: Commit and push imported results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- results/yolo26s_cbam_akconv .gitattributes
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "Import YOLO26s CBAM AKConv run results"
          git push origin main
