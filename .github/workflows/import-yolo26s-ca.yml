name: Import YOLO26s CA results

on:
  push:
    paths:
      - ".github/workflows/import-yolo26s-ca.yml"

permissions:
  contents: write

jobs:
  import-results:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Download and validate archive
        env:
          DRIVE_FILE_ID: 1Xq7_rVoZwNfNmgbfEldIZtLOUYVcl7TB
        run: |
          python -m pip install --disable-pip-version-check --quiet gdown pyyaml
          mkdir -p /tmp/yolo26s-ca
          gdown "$DRIVE_FILE_ID" --output /tmp/yolo26s-ca/ca_runs.zip
          test -s /tmp/yolo26s-ca/ca_runs.zip
          sha256sum /tmp/yolo26s-ca/ca_runs.zip
          unzip -tq /tmp/yolo26s-ca/ca_runs.zip

      - name: Extract result files directly into target
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/yolo26s-ca/ca_runs.zip
          extracted=/tmp/yolo26s-ca/extracted
          target=results/yolo26s_ca

          mkdir -p "$extracted" "$target"
          unzip -q "$archive" -d "$extracted"
          find "$extracted" -type d -name __MACOSX -prune -exec rm -rf {} +

          mapfile -d '' candidates < <(
            find "$extracted" -type f -name results.csv -printf '%h\0'
          )

          valid=()
          for candidate in "${candidates[@]}"; do
            if [ -f "$candidate/args.yaml" ]; then
              valid+=("$candidate")
            fi
          done

          source_dir=""
          if [ "${#valid[@]}" -eq 1 ]; then
            source_dir="${valid[0]}"
          else
            for candidate in "${valid[@]}"; do
              if [ "$(basename "$candidate")" = "yolo26s_ca_scratch" ]; then
                if [ -n "$source_dir" ]; then
                  echo "Multiple matching YOLO26s CA result directories were found." >&2
                  exit 1
                fi
                source_dir="$candidate"
              fi
            done
          fi

          if [ -z "$source_dir" ]; then
            echo "Could not identify a unique result directory containing args.yaml and results.csv." >&2
            find "$extracted" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Import source: $source_dir"
          rsync -a             --exclude='README.md'             --exclude='__MACOSX/'             --exclude='.DS_Store'             "$source_dir"/ "$target"/

      - name: Inspect imported results
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          import yaml

          root = Path("results/yolo26s_ca")
          archive = Path("/tmp/yolo26s-ca/ca_runs.zip")
          files = sorted(
              p for p in root.rglob("*")
              if p.is_file() and p.name not in {"README.md", ".gitkeep"}
          )
          dirs = sorted(p for p in root.rglob("*") if p.is_dir())

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          csv_reports = []
          for path in files:
              if path.suffix.lower() != ".csv" or path.stat().st_size > 5_000_000:
                  continue
              try:
                  with path.open("r", encoding="utf-8-sig", newline="") as f:
                      rows = list(csv.DictReader(f))
                  if not rows:
                      continue
                  normalized = [{str(k).strip(): v for k, v in row.items()} for row in rows]
                  metric_key = next(
                      (k for k in normalized[0] if "map50-95" in k.lower()),
                      None,
                  )
                  best = None
                  if metric_key:
                      numeric = []
                      for row in normalized:
                          try:
                              numeric.append((float(row[metric_key]), row))
                          except (TypeError, ValueError):
                              pass
                      if numeric:
                          best = max(numeric, key=lambda item: item[0])[1]
                  csv_reports.append({
                      "path": path.as_posix(),
                      "row_count": len(normalized),
                      "columns": list(normalized[0].keys()),
                      "best_map50_95_row": best,
                      "last_row": normalized[-1],
                  })
              except Exception as exc:
                  csv_reports.append({"path": path.as_posix(), "error": str(exc)})

          yaml_reports = []
          for path in files:
              if path.suffix.lower() not in {".yaml", ".yml"} or path.stat().st_size > 1_000_000:
                  continue
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
                  yaml_reports.append({"path": path.as_posix(), "data": data})
              except Exception as exc:
                  yaml_reports.append({"path": path.as_posix(), "error": str(exc)})

          report = {
              "archive_sha256": sha256(archive),
              "file_count": len(files),
              "directory_count": len(dirs),
              "total_bytes": sum(p.stat().st_size for p in files),
              "extensions": dict(sorted(Counter(
                  p.suffix.lower() or "<none>" for p in files
              ).items())),
              "large_files": [
                  {"path": p.as_posix(), "bytes": p.stat().st_size}
                  for p in files if p.stat().st_size >= 95 * 1024 * 1024
              ],
              "file_inventory": [
                  {"path": p.as_posix(), "bytes": p.stat().st_size}
                  for p in files
              ],
              "csv_reports": csv_reports,
              "yaml_reports": yaml_reports,
          }
          print("IMPORT_REPORT_JSON=" + json.dumps(
              report, ensure_ascii=False, separators=(",", ":")
          ))
          PY

      - name: Configure Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs track 'results/yolo26s_ca/**/*.pt'
          while IFS= read -r -d '' file; do
            git lfs track -- "$file"
          done < <(find results/yolo26s_ca -type f -size +95M -print0)

      - name: Commit imported result files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- results/yolo26s_ca .gitattributes
          if git diff --cached --quiet; then
            echo "No new result files were found."
            exit 0
          fi
          git commit -m "Import YOLO26s CA run results"
          git push origin HEAD:main
