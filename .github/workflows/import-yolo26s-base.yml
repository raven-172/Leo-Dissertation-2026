name: Import YOLO26s base results

on:
  push:
    paths:
      - ".github/workflows/import-yolo26s-base.yml"

permissions:
  contents: write

jobs:
  import-results:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Download and validate archive
        env:
          DRIVE_FILE_ID: 1YDFIFv-qTh6kxvSJwZGIku_-R4zBjHM2
        run: |
          python -m pip install --disable-pip-version-check --quiet gdown pyyaml
          mkdir -p /tmp/yolo26s-base
          gdown "$DRIVE_FILE_ID" --output /tmp/yolo26s-base/base_runs.zip
          test -s /tmp/yolo26s-base/base_runs.zip
          sha256sum /tmp/yolo26s-base/base_runs.zip
          unzip -tq /tmp/yolo26s-base/base_runs.zip

      - name: Extract results into the repository
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/yolo26s-base/base_runs.zip
          extracted=/tmp/yolo26s-base/extracted
          target=results/yolo26s_base

          mkdir -p "$extracted" "$target"
          unzip -q "$archive" -d "$extracted"
          find "$extracted" -type d -name __MACOSX -prune -exec rm -rf {} +

          source_dir="$extracted"
          mapfile -d '' top_dirs < <(find "$extracted" -mindepth 1 -maxdepth 1 -type d -print0)
          mapfile -d '' top_files < <(find "$extracted" -mindepth 1 -maxdepth 1 -type f -print0)

          if [ "${#top_dirs[@]}" -eq 1 ] && [ "${#top_files[@]}" -eq 0 ]; then
            wrapper_name="$(basename "${top_dirs[0]}")"
            if [[ "$wrapper_name" =~ ^(base_runs|runs|base-results|base_results)$ ]]; then
              source_dir="${top_dirs[0]}"
            fi
          fi

          if ! find "$source_dir" -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            echo "The archive does not contain any result folders." >&2
            exit 1
          fi

          rsync -a             --exclude='README.md'             --exclude='__MACOSX/'             --exclude='.DS_Store'             "$source_dir"/ "$target"/

      - name: Inspect imported results
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          import yaml

          root = Path("results/yolo26s_base")
          archive = Path("/tmp/yolo26s-base/base_runs.zip")
          files = sorted(p for p in root.rglob("*") if p.is_file() and p.name != ".gitkeep")
          dirs = sorted(p for p in root.rglob("*") if p.is_dir())

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          csv_reports = []
          for path in files:
              if path.suffix.lower() != ".csv" or path.stat().st_size > 5_000_000:
                  continue
              try:
                  with path.open("r", encoding="utf-8-sig", newline="") as f:
                      rows = list(csv.DictReader(f))
                  if not rows:
                      continue
                  normalized = [{str(k).strip(): v for k, v in row.items()} for row in rows]
                  metric_key = next(
                      (k for k in normalized[0] if "map50-95" in k.lower()),
                      None,
                  )
                  best = None
                  if metric_key:
                      numeric = []
                      for row in normalized:
                          try:
                              numeric.append((float(row[metric_key]), row))
                          except (TypeError, ValueError):
                              pass
                      if numeric:
                          best = max(numeric, key=lambda item: item[0])[1]
                  csv_reports.append({
                      "path": path.as_posix(),
                      "row_count": len(normalized),
                      "columns": list(normalized[0].keys()),
                      "best_map50_95_row": best,
                      "last_row": normalized[-1],
                  })
              except Exception as exc:
                  csv_reports.append({"path": path.as_posix(), "error": str(exc)})

          yaml_reports = []
          for path in files:
              if path.suffix.lower() not in {".yaml", ".yml"} or path.stat().st_size > 1_000_000:
                  continue
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
                  yaml_reports.append({"path": path.as_posix(), "data": data})
              except Exception as exc:
                  yaml_reports.append({"path": path.as_posix(), "error": str(exc)})

          large_files = [
              {"path": p.as_posix(), "bytes": p.stat().st_size}
              for p in files if p.stat().st_size >= 95 * 1024 * 1024
          ]
          top_level = sorted(p.name for p in root.iterdir() if p.name not in {"README.md", ".gitkeep"})
          extensions = Counter((p.suffix.lower() or "<none>") for p in files)
          report = {
              "archive_sha256": sha256(archive),
              "file_count": len(files),
              "directory_count": len(dirs),
              "total_bytes": sum(p.stat().st_size for p in files),
              "top_level_items": top_level,
              "extensions": dict(sorted(extensions.items())),
              "large_files": large_files,
              "file_inventory": [
                  {"path": p.as_posix(), "bytes": p.stat().st_size}
                  for p in files
              ],
              "csv_reports": csv_reports,
              "yaml_reports": yaml_reports,
          }
          print("IMPORT_REPORT_JSON=" + json.dumps(report, ensure_ascii=False, separators=(",", ":")))
          PY

      - name: Configure Git LFS for oversized files
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs track 'results/yolo26s_base/**/*.pt'
          while IFS= read -r -d '' file; do
            git lfs track -- "$file"
          done < <(find results/yolo26s_base -type f -size +95M -print0)

      - name: Commit imported result folders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- results/yolo26s_base .gitattributes
          if git diff --cached --quiet; then
            echo "No new result files were found."
            exit 0
          fi
          git commit -m "Import YOLO26s base run results"
          git push origin HEAD:main
